          description: "原实例序号；正数标识，按 §1.1 校验。"
          schema:
            "$ref": "#/components/schemas/PosID"
          example: "3"
        - name: "revision"
          in: "query"
          required: true
          description: "必须等于目标最新修订；过时返回 409 REVISION_CONFLICT，见 §1.1。"

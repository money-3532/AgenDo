                    type: "string"
                    enum: ["VALIDATION_FAILED"]
    Error404ResourceNotFound:
      description: "RESOURCE_NOT_FOUND。目标不存在、已不可访问或不属于当前用户"
      content:
        "application/json":
          schema:
            allOf:

          schema:
            allOf:
              - "$ref": "#/components/schemas/Error"
              - type: "object"
                properties:
                  code:
                    type: "string"
                    enum: ["RESULT_PENDING","PLAN_CHANGED"]
    Error409ResultPendingOrUndoConflict:
      description: "UNDO_CONFLICT。撤销资格或保护条件变化\nRESULT_PENDING。仍有在途或未知结果"
      content:
        "application/json":
          schema:
            allOf:
              - "$ref": "#/components/schemas/Error"
              - type: "object"
                properties:
                  code:
                    type: "string"
                    enum: ["UNDO_CONFLICT","RESULT_PENDING"]
    Error409ResultPendingOrRevisionConflict:
      description: "RESULT_PENDING。仍有在途或未知结果\nREVISION_CONFLICT。提交修订已过时"
      content:
        "application/json":
          schema:
            allOf:
              - "$ref": "#/components/schemas/Error"
              - type: "object"
                properties:
                  code:
                    type: "string"
                    enum: ["RESULT_PENDING","REVISION_CONFLICT"]
  schemas:
    PosID:
      type: "string"
      minLength: 1
      maxLength: 20
      pattern: "^[1-9][0-9]{0,19}$"
      description: "规范十进制字符串，最大值 18446744073709551615。"
    UUID:
      type: "string"
      minLength: 36
      maxLength: 36
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      format: "uuid"
      not:
        const: "00000000-0000-0000-0000-000000000000"
    RecycleID:
      oneOf:
        - "$ref": "#/components/schemas/PosID"
        - "$ref": "#/components/schemas/UUID"
      description: "CALENDAR_SERIES 使用 UUID 删除记录 ID，其余类型使用 PosID。"
    Date:
      type: "string"
      minLength: 10
      maxLength: 10
      pattern: "^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}$"
      format: "date"
    Time:
      type: "string"
      minLength: 5
      maxLength: 8
      pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$"
    Instant:
      type: "string"
      minLength: 20
      maxLength: 29
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]{1,3})?(?:Z|[+-](?:(?:0[0-9]|1[0-3]):[0-5][0-9]|14:00))$"
      format: "date-time"
    UInt32:
      type: "integer"
      minimum: 1
      maximum: 4294967295
    UInt32String:
      type: "string"
      minLength: 1
      maxLength: 10
      pattern: "^[1-9][0-9]{0,9}$"
      description: "最大值 4294967295。"
    Cursor:
      type: "string"
      minLength: 1
      maxLength: 2048
      pattern: "^[!-~]+$"
      description: "服务端签发，不透明。仅用于签发游标时的用户、筛选和排序。"
    Fingerprint:
      type: "string"
      minLength: 64
      maxLength: 64
      pattern: "^[0-9a-f]{64}$"
    CsrfToken:
      type: "string"
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
    IdempotencyKey:
      type: "string"
      minLength: 36
      maxLength: 36
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    ResourceType:
      type: "string"
      enum: ["TODO","CALENDAR_EVENT","CALENDAR_SERIES","NOTE","ASSET"]
    TodoPriority:
      type: "string"
      enum: ["NORMAL","URGENT","IMPORTANT","DEFERABLE"]
    TodoDisplayStatus:
      type: "string"
      enum: ["OPEN","OVERDUE","COMPLETED","CANCELED"]
    TodoStateAction:
      type: "string"
      enum: ["COMPLETE","CANCEL","REOPEN"]
    RepeatScope:
      type: "string"
      enum: ["THIS","THIS_AND_FOLLOWING","ENTIRE_SERIES"]
    OperationPhase:
      type: "string"
      enum: ["DRAFT","READY","RUNNING","RECONCILING","FINISHED"]
    StepId:
      type: "string"
      minLength: 1
      maxLength: 32
      pattern: "^[A-Za-z][A-Za-z0-9_-]{0,31}$"
    Deadline:
      oneOf:
        - type: "object"
          properties:
            type:
              type: "string"
              const: "DATE"
            date:
              "$ref": "#/components/schemas/Date"
          required: ["type","date"]
          additionalProperties: false
        - type: "object"
          properties:
            type:
              type: "string"
              const: "DATETIME"
            date:
              "$ref": "#/components/schemas/Date"
            time:
              "$ref": "#/components/schemas/Time"
          required: ["type","date","time"]
          additionalProperties: false
      description: "共享 DTO，见 Deadline。"
    TodoReminder:
      oneOf:
        - type: "object"
          properties:
            mode:
              type: "string"
              const: "ENABLED"
          required: ["mode"]
          additionalProperties: false
        - type: "object"
          properties:
            mode:
              type: "string"
              const: "PAUSED"
            resumeAt:
              "$ref": "#/components/schemas/Instant"
          required: ["mode","resumeAt"]
          additionalProperties: false
        - type: "object"
          properties:
            mode:
              type: "string"
              const: "CLOSED"
          required: ["mode"]
          additionalProperties: false
      description: "共享 DTO，见 TodoReminder。"
    Recurrence:
      oneOf:
        - type: "object"
          properties:
            type:
              type: "string"
              const: "DAILY"
          required: ["type"]
          additionalProperties: false
        - type: "object"
          properties:
            type:
              type: "string"
              const: "WEEKLY"
            weekdays:
              type: "array"
              items:
                type: "integer"
                minimum: 1
                maximum: 7
              minItems: 1
              maxItems: 7
              uniqueItems: true
              description: "周一为 1。省略时取创建业务日的星期。"
          required: ["type"]
          additionalProperties: false
        - type: "object"
          properties:
            type:
              type: "string"
              const: "MONTHLY"
            dayOfMonth:
              type: "integer"
              minimum: 1
              maximum: 31
          required: ["type","dayOfMonth"]
          additionalProperties: false
      description: "共享 DTO，见 Recurrence。"
    EventReminder:
      oneOf:
        - type: "object"
          properties:
            type:
              type: "string"
              const: "NONE"
          required: ["type"]
          additionalProperties: false
        - type: "object"
          properties:
            type:
              type: "string"
              const: "BEFORE_MINUTES"
            value:
              type: "integer"
              enum: [5,15,30,60]
          required: ["type","value"]
          additionalProperties: false
        - type: "object"
          properties:
            type:
              type: "string"
              const: "BEFORE_DAYS"
            value:
              type: "integer"
              const: 1
          required: ["type","value"]
          additionalProperties: false
        - type: "object"
          properties:
            type:
              type: "string"
              const: "ALL_DAY_AT_TIME"
            daysBefore:
              type: "integer"
              enum: [0,1]
            reminderTime:
              "$ref": "#/components/schemas/Time"
          required: ["type","daysBefore","reminderTime"]
          additionalProperties: false
      description: "共享 DTO，见 EventReminder。"
    Run:
      type: "object"
      properties:
        text:
          type: "string"
          minLength: 0
          maxLength: 20000
          pattern: "^[^\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f\\u007f]*$"
        marks:
          type: "array"
          items:
            type: "string"
            enum: ["BOLD","ITALIC"]
          minItems: 0
          maxItems: 2
          uniqueItems: true
        href:
          type: "string"
          minLength: 1
          maxLength: 2048
          pattern: "^https?://[^/@\\s#?]+(?:[/?#]\\S*)?$"
          format: "uri"
      required: ["text"]
      additionalProperties: false
      description: "共享 DTO，见 Run。"
    CalendarExclude:
      oneOf:
        - type: "object"
          properties:
            id:
              "$ref": "#/components/schemas/PosID"
          required: ["id"]
          additionalProperties: false
        - type: "object"
          properties:
            seriesId:
              "$ref": "#/components/schemas/PosID"
            occurrenceNo:
              "$ref": "#/components/schemas/PosID"
          required: ["seriesId","occurrenceNo"]
          additionalProperties: false
    AnalysisInput:
      oneOf:
        - type: "object"
          properties:
            type:
              type: "string"
              const: "TEXT"
            text:
              type: "string"
              minLength: 1
              maxLength: 20000
              pattern: "^[^\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f\\u007f]*$"
          required: ["type","text"]
          additionalProperties: false
        - type: "object"
          properties:
            type:
              type: "string"
              const: "UPLOAD"
            uploadId:
              "$ref": "#/components/schemas/UUID"
          required: ["type","uploadId"]
          additionalProperties: false
        - type: "object"
          properties:
            type:
              type: "string"
              const: "ASSET"
            assetId:
              "$ref": "#/components/schemas/PosID"
          required: ["type","assetId"]
          additionalProperties: false
    PushKeys:
      type: "object"
      properties:
        p256dh:
          type: "string"
          minLength: 87
          maxLength: 87
          pattern: "^[A-Za-z0-9_-]{86}[AEIMQUYcgkosw048]$"
        auth:
          type: "string"
          minLength: 22
          maxLength: 22
          pattern: "^[A-Za-z0-9_-]{21}[AQgw]$"
      required: ["p256dh","auth"]
      additionalProperties: false
    StepTargetReference:
      type: "object"
      properties:
        fromStep:
          "$ref": "#/components/schemas/StepId"
        output:
          type: "string"
          const: "target"
      required: ["fromStep","output"]
      additionalProperties: false
    Node:
      oneOf:
        - type: "object"
          properties:
            type:
              type: "string"
              const: "PARAGRAPH"
            runs:
              type: "array"
              items:
                "$ref": "#/components/schemas/Run"
              maxItems: 200
          required: ["type","runs"]
          additionalProperties: false
        - type: "object"
          properties:
            type:
              type: "string"
              const: "LIST"
            ordered:
              type: "boolean"
            items:
              type: "array"
              items:
                type: "object"
                properties:
                  runs:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/Run"
                    maxItems: 200
                required: ["runs"]
                additionalProperties: false
              minItems: 1
              maxItems: 200
          required: ["type","ordered","items"]
          additionalProperties: false
        - type: "object"
          properties:
            type:
              type: "string"
              const: "CHECKLIST"
            items:
              type: "array"
              items:
                type: "object"
                properties:
                  runs:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/Run"
                    maxItems: 200
                  checked:
                    type: "boolean"
                required: ["runs","checked"]
                additionalProperties: false
              minItems: 1
              maxItems: 200
          required: ["type","items"]
          additionalProperties: false
        - type: "object"
          properties:
            type:
              type: "string"
              const: "ATTACHMENT"
            assetId:
              "$ref": "#/components/schemas/PosID"
          required: ["type","assetId"]
          additionalProperties: false
      description: "共享 DTO，见 Node。"
    Session:
      type: "object"
      properties:
        user:
          "$ref": "#/components/schemas/User"
          description: "当前账号"
        expiresAt:
          "$ref": "#/components/schemas/Instant"
          description: "到期时点"
        csrfToken:
          "$ref": "#/components/schemas/CsrfToken"
          description: "后续写请求令牌"
      required: ["user","expiresAt","csrfToken"]
      additionalProperties: false
      description: "共享 DTO，见 Session。"
    User:
      type: "object"
      properties:
        id:
          "$ref": "#/components/schemas/PosID"
          description: "账号"
        username:
          type: "string"
          minLength: 1
          maxLength: 80
          pattern: "^[^\\u0000-\\u001f\\u007f]*$"
          description: "登录名"
      required: ["id","username"]
      additionalProperties: false
      description: "共享 DTO，见 User。"
    Ref:
      type: "object"
      properties:
        type:
          "$ref": "#/components/schemas/ResourceType"
          description: "TODO / CALENDAR_EVENT / CALENDAR_SERIES / NOTE / ASSET"
        id:
          "$ref": "#/components/schemas/PosID"
          description: "源对象 ID"
      required: ["type","id"]
      additionalProperties: false
      description: "共享 DTO，见 Ref。"
    Todo:
      type: "object"
      properties:
        id:
          "$ref": "#/components/schemas/PosID"
          description: "待办 ID"
        revision:
          "$ref": "#/components/schemas/PosID"
          description: "当前修订"
        title:
          type: "string"
          minLength: 1
          maxLength: 200
          pattern: "^[^\\u0000-\\u001f\\u007f]*$"
          description: "标题"
        description:
          type: ["string","null"]
          minLength: 1
          maxLength: 4000
          pattern: "^[^\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f\\u007f]*$"
          description: "描述"
        deadline:
          anyOf:
            - "$ref": "#/components/schemas/Deadline"
            - type: "null"
          description: "截止"
        priority:
          "$ref": "#/components/schemas/TodoPriority"
          description: "优先级"
        reminder:
          "$ref": "#/components/schemas/TodoReminder"
          description: "已存配置"
        effectiveReminderMode:
          type: "string"
          enum: ["ENABLED","PAUSED","CLOSED"]
          description: "当前有效控制"
        status:
          type: "string"
          enum: ["OPEN","COMPLETED","CANCELED"]
          description: "OPEN / COMPLETED / CANCELED"
        displayStatus:
          "$ref": "#/components/schemas/TodoDisplayStatus"
          description: "status 或 OVERDUE"
      required: ["id","revision","title","description","deadline","priority","reminder","effectiveReminderMode","status","displayStatus"]
      additionalProperties: false
      description: "共享 DTO，见 Todo。"
    Event:
      type: "object"
      properties:
        id:
          "$ref": "#/components/schemas/PosID"
          description: "普通日程 ID"
        seriesId:
          "$ref": "#/components/schemas/PosID"
          description: "系列 ID"
        occurrenceNo:
          "$ref": "#/components/schemas/PosID"
          description: "稳定实例序号，与 seriesId 一起返回"
        revision:
          "$ref": "#/components/schemas/PosID"
          description: "普通记录或系列修订"
        title:
          type: "string"
          minLength: 1
          maxLength: 200
          pattern: "^[^\\u0000-\\u001f\\u007f]*$"
          description: "标题"
        date:
          "$ref": "#/components/schemas/Date"
          description: "实际展示日期"
        allDay:
          type: "boolean"
          description: "是否全天"
        startTime:
          anyOf:
            - "$ref": "#/components/schemas/Time"
            - type: "null"
          description: "开始"
        endTime:
          anyOf:
            - "$ref": "#/components/schemas/Time"
            - type: "null"
          description: "结束"
        description:
          type: ["string","null"]
          minLength: 1
          maxLength: 4000
          pattern: "^[^\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f\\u007f]*$"
          description: "说明"
        location:
          type: ["string","null"]
          minLength: 1
          maxLength: 255
          pattern: "^[^\\u0000-\\u001f\\u007f]*$"
          description: "地点"
        recurrence:
          anyOf:
            - "$ref": "#/components/schemas/Recurrence"
            - type: "null"
          description: "所属重复规则"
        reminder:
          "$ref": "#/components/schemas/EventReminder"
          description: "当前配置"
      required: ["revision","title","date","allDay","startTime","endTime","description","location","recurrence","reminder"]
      additionalProperties: false
      description: "共享 DTO，见 Event。"
      oneOf:
        - required: ["id"]
          not:
            anyOf:
              - required: ["seriesId"]
              - required: ["occurrenceNo"]
        - required: ["seriesId","occurrenceNo"]
          not:
            required: ["id"]
    ScopeResult:
      type: "object"
      properties:
        seriesId:
          "$ref": "#/components/schemas/PosID"
          description: "系列"
        occurrenceNo:
          "$ref": "#/components/schemas/PosID"
          description: "命令选中序号"
        scope:
          "$ref": "#/components/schemas/RepeatScope"
          description: "实际请求范围"
        revision:
          "$ref": "#/components/schemas/PosID"
          description: "系列修订"
        changed:
          type: "boolean"
          description: "是否写入变更"
      required: ["seriesId","occurrenceNo","scope","revision","changed"]
      additionalProperties: false
      description: "共享 DTO，见 ScopeResult。"
    Note:
      type: "object"
      properties:
        id:
          "$ref": "#/components/schemas/PosID"
          description: "备忘录"
        revision:
          "$ref": "#/components/schemas/PosID"
          description: "修订"
        title:
          type: "string"
          minLength: 1
          maxLength: 200
          pattern: "^[^\\u0000-\\u001f\\u007f]*$"
          description: "标题"
        body:
          type: "array"
          items:
            "$ref": "#/components/schemas/Node"
          maxItems: 500
          description: "结构化正文"
      required: ["id","revision","title","body"]
      additionalProperties: false
      description: "共享 DTO，见 Note。"
    Asset:
      type: "object"
      properties:
        id:
          "$ref": "#/components/schemas/PosID"
          description: "持久文件"
        revision:
          "$ref": "#/components/schemas/PosID"
          description: "修订"
        fileName:
          type: "string"
          description: "原始文件名"
        mediaType:
          type: "string"
          description: "媒体类型"
        sizeBytes:
          type: "integer"
          minimum: 1
          description: "字节数"
        displayName:
          type: "string"
          description: "显示名"
        purpose:
          type: ["string","null"]
          description: "用途"
        keywords:
          type: "array"
          items:
            type: "string"
            minLength: 1
            maxLength: 32
            pattern: "^[^\\u0000-\\u001f\\u007f]*$"
          minItems: 0
          maxItems: 12
          uniqueItems: true
          description: "关键词"
        inLibrary:
          type: "boolean"
          description: "资料库成员"
        uploadedAt:
          "$ref": "#/components/schemas/Instant"
          description: "上传时间"
      required: ["id","revision","fileName","mediaType","sizeBytes","displayName","purpose","keywords","inLibrary","uploadedAt"]
      additionalProperties: false
      description: "共享 DTO，见 Asset。"
    Upload:
      type: "object"
      properties:
        id:
          "$ref": "#/components/schemas/UUID"
          description: "暂存 ID"
        fileName:
          type: "string"
          description: "原名"
        mediaType:
          type: "string"
          description: "类型"
        sizeBytes:
          type: "integer"
          minimum: 1
          maximum: 10485760
          description: "字节数"
        expiresAt:
          "$ref": "#/components/schemas/Instant"
          description: "到期时点"
        interactionId:
          anyOf:
            - "$ref": "#/components/schemas/UUID"
            - type: "null"
          description: "所属交互"
      required: ["id","fileName","mediaType","sizeBytes","expiresAt","interactionId"]
      additionalProperties: false
      description: "共享 DTO，见 Upload。"
    AssetRef:
      type: "object"
      properties:
        kind:
          type: "string"
          enum: ["RELATION","NOTE_ATTACHMENT"]
          description: "RELATION / NOTE_ATTACHMENT"
        ref:
          "$ref": "#/components/schemas/Ref"
          description: "引用者"
        inRecycleBin:
          type: "boolean"
          description: "引用者是否回收"
        revision:
          "$ref": "#/components/schemas/PosID"
          description: "解除动作的目标修订"
        relationId:
          "$ref": "#/components/schemas/PosID"
          description: "关系引用才有"
      required: ["kind","ref","inRecycleBin","revision"]
      additionalProperties: false
      description: "共享 DTO，见 AssetRef。"
    Relation:
      type: "object"
      properties:
        id:
          "$ref": "#/components/schemas/PosID"
          description: "关系"
        left:
          "$ref": "#/components/schemas/Ref"
          description: "规范化左端"
        right:
          "$ref": "#/components/schemas/Ref"
          description: "规范化右端"
      required: ["id","left","right"]
      additionalProperties: false
      description: "共享 DTO，见 Relation。"
    RelationEntry:
      type: "object"
      properties:
        relation:
          "$ref": "#/components/schemas/Relation"
          description: "有效或保留的关系"
        otherEndpointState:
          type: "string"
          enum: ["ACTIVE","IN_RECYCLE_BIN"]
          description: "ACTIVE / IN_RECYCLE_BIN"
        unavailable:
          type: "object"
          properties:
            type:
              "$ref": "#/components/schemas/ResourceType"
            reason:
              type: "string"
          required: ["type","reason"]
          additionalProperties: false
          description: "仅缺失提示，含 type、reason"
      additionalProperties: false
      description: "共享 DTO，见 RelationEntry。"
    SearchHit:
      type: "object"
      properties:
        ref:
          "$ref": "#/components/schemas/Ref"
          description: "跳转目标"
        title:
          type: "string"
          description: "标题"
        summary:
          type: ["string","null"]
          description: "摘要"
        occurrenceNo:
          "$ref": "#/components/schemas/PosID"
          description: "重复实例序号"
      required: ["ref","title","summary"]
      additionalProperties: false
      description: "共享 DTO，见 SearchHit。"
    RecycleItem:
      type: "object"
      properties:
        id:
          "$ref": "#/components/schemas/RecycleID"
          description: "回收项 ID"
        target:
          "$ref": "#/components/schemas/Ref"
          description: "原对象"
        revision:
          "$ref": "#/components/schemas/PosID"
          description: "回收项修订"
        title:
          type: "string"
          description: "标题"
        deletedAt:
          "$ref": "#/components/schemas/Instant"
          description: "删除时点"
        scope:
          "$ref": "#/components/schemas/RepeatScope"
          description: "重复范围"
        occurrenceNo:
          "$ref": "#/components/schemas/PosID"
          description: "重复范围起点"
      required: ["id","target","revision","title","deletedAt"]
      additionalProperties: false
      description: "共享 DTO，见 RecycleItem。"
    Deleted:
      type: "object"
      properties:
        target:
          "$ref": "#/components/schemas/Ref"
          description: "原对象"
        revision:

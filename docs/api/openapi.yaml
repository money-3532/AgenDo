      description: "按原序号处理范围；整个系列修改保留已发生历史。\n\nAPI-20\n\n变更后，以返回的 seriesId 和 scope 对应的原序号范围标记已加载实例失效；THIS 处理选中原序号，THIS_AND_FOLLOWING 处理选中及后续原序号，ENTIRE_SERIES 处理系列缓存。重新调用 API-18 读取已加载的日期窗口，包括原先未出现该系列的窗口，因为移动可能让实例进入这些窗口。"
      operationId: "updateSeriesOccurrence"
      parameters:
        - name: "sid"
          in: "path"
          required: true
          description: "系列 ID；正数标识，按 §1.1 校验。"
          schema:
            "$ref": "#/components/schemas/PosID"
          example: "210"
        - name: "no"
          in: "path"
          required: true
          description: "原实例序号；正数标识，按 §1.1 校验。"
          schema:
            "$ref": "#/components/schemas/PosID"
          example: "3"
        - name: "X-CSRF-Token"
          in: "header"
          required: true
          description: "规范 Base64url，固定 43 字符，绑定当前会话，见 §1.2。"
          schema:
            "$ref": "#/components/schemas/CsrfToken"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UpdateSeriesOccurrenceRequest"
            example:
              revision: "1"
              scope: "THIS"
              changes:
                title: "改名"
      responses:
        "200":
          description: "成功。"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ScopeResult"
              example:
                seriesId: "210"
                occurrenceNo: "3"
                scope: "THIS"
                revision: "2"
                changed: true
        "400":
          "$ref": "#/components/responses/Error400InvalidRequest"
        "401":
          "$ref": "#/components/responses/Error401AuthRequired"
        "403":
          "$ref": "#/components/responses/Error403CsrfInvalid"
        "404":
          "$ref": "#/components/responses/Error404ResourceNotFound"
        "409":
          "$ref": "#/components/responses/Error409RevisionConflict"
        "415":
          "$ref": "#/components/responses/Error415UnsupportedMediaType"
        "422":
          "$ref": "#/components/responses/Error422ValidationFailed"
    delete:
      tags: ["日程"]
      summary: "按范围删除重复日程"
      description: "整个系列删除包含历史；仅本次删除保留可恢复遮蔽。\n\nAPI-21"
      operationId: "deleteSeriesOccurrence"
      parameters:
        - name: "sid"
          in: "path"
          required: true
          description: "系列 ID；正数标识，按 §1.1 校验。"
          schema:

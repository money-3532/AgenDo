              schema:
                "$ref": "#/components/schemas/Deleted"
              example:
                target:
                  type: "CALENDAR_SERIES"
                  id: "210"
                revision: "2"
                recycleItemId: "601"
                recycleRevision: "1"
        "400":
          "$ref": "#/components/responses/Error400InvalidRequest"
        "401":

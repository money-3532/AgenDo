  "/push-subscriptions":
    post:
      tags: ["通知"]
      summary: "登记设备推送订阅"
      description: "示例材料用真实浏览器订阅替换；同一账号设备重复登记复用。\n\nAPI-54\n\n服务端以可信当前账号、有效会话和浏览器实际订阅端点建立绑定。同一账号同一端点重登登记时复用原订阅 ID，并原子切换到当前会话，旧会话退出只处理仍归它的绑定。端点轮换时，客户端保存订阅 ID，并在原会话有效时注销旧 ID，再登记新端点。已由其他账号绑定的端点不可接管，统一返回 404 RESOURCE_NOT_FOUND。"
      operationId: "registerPushSubscription"
      parameters:
        - name: "X-CSRF-Token"
          in: "header"
          required: true
          description: "规范 Base64url，固定 43 字符，绑定当前会话，见 §1.2。"
          schema:
            "$ref": "#/components/schemas/CsrfToken"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RegisterPushSubscriptionRequest"
            example:
              endpoint: "https://push.example.invalid/demo"
              expirationTime: null
              keys:
                p256dh: "BAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                auth: "AAAAAAAAAAAAAAAAAAAAAA"
      responses:
        "200":
          description: "已存在订阅的更新结果。"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Subscription"
              example:
                id: "801"
                active: true
        "201":
          description: "已创建。"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Subscription"
              example:
                id: "801"
                active: true
        "400":
          "$ref": "#/components/responses/Error400InvalidRequest"
        "401":
          "$ref": "#/components/responses/Error401AuthRequired"
        "403":
          "$ref": "#/components/responses/Error403CsrfInvalid"
        "404":
          "$ref": "#/components/responses/Error404ResourceNotFound"
        "415":
          "$ref": "#/components/responses/Error415UnsupportedMediaType"
        "422":
          "$ref": "#/components/responses/Error422ValidationFailed"
  "/push-subscriptions/{id}":
    delete:
      tags: ["通知"]
      summary: "注销设备推送订阅"
      description: "仅处理当前账号与设备绑定的订阅，阻止未声明的发送。\n\nAPI-55\n\n目标订阅必须仍绑定可信当前账号和当前会话。已经切换绑定到其他会话或不可访问的订阅返回 404 RESOURCE_NOT_FOUND。"
      operationId: "unregisterPushSubscription"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "目标标识，格式及归属/状态校验见 §1.1。"
          schema:
            "$ref": "#/components/schemas/PosID"
          example: "801"
        - name: "X-CSRF-Token"
          in: "header"
          required: true
          description: "规范 Base64url，固定 43 字符，绑定当前会话，见 §1.2。"
          schema:
            "$ref": "#/components/schemas/CsrfToken"
      responses:
        "204":
          description: "成功，无响应体。"
        "400":
          "$ref": "#/components/responses/Error400InvalidRequest"
        "401":
          "$ref": "#/components/responses/Error401AuthRequired"
        "403":
          "$ref": "#/components/responses/Error403CsrfInvalid"
        "404":
          "$ref": "#/components/responses/Error404ResourceNotFound"
        "422":
          "$ref": "#/components/responses/Error422ValidationFailed"
components:
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "JSESSIONID"
      description: "通过服务端签发的 HttpOnly、SameSite=Lax 会话 Cookie 认证。生产环境启用 Secure。Spring Boot 内嵌 Servlet 容器默认使用 JSESSIONID。请求头示例为 Cookie: JSESSIONID=example-session-id。"
  responses:
    Error409IdempotencyConflictOrResultPending:
      description: "IDEMPOTENCY_CONFLICT。同一键携带不同参数。原样重放；新意图才换键。\nRESULT_PENDING。仍有在途或未知结果。按原意图核对，勿换键重试。"
      content:
        "application/json":
          schema:
            allOf:
              - "$ref": "#/components/schemas/Error"
              - type: "object"
                properties:
                  code:
                    type: "string"
                    enum: ["IDEMPOTENCY_CONFLICT","RESULT_PENDING"]
    Error409IdempotencyConflictOrResultPendingOrUploadExpired:
      description: "IDEMPOTENCY_CONFLICT。同一键携带不同参数。原样重放；新意图才换键。\nRESULT_PENDING。仍有在途或未知结果。按原意图核对，勿换键重试。\nUPLOAD_EXPIRED。暂存文件过期或已失效。先核对原保存结果，必要时重新上传。"
      content:
        "application/json":
          schema:
            allOf:
              - "$ref": "#/components/schemas/Error"
              - type: "object"
                properties:
                  code:
                    type: "string"
                    enum: ["IDEMPOTENCY_CONFLICT","RESULT_PENDING","UPLOAD_EXPIRED"]
    Error400InvalidRequest:
      description: "INVALID_REQUEST。请求类型、字段或游标错误"
      content:
        "application/json":
          schema:
            allOf:
              - "$ref": "#/components/schemas/Error"
              - type: "object"
                properties:
                  code:
                    type: "string"
                    enum: ["INVALID_REQUEST"]
    Error401AuthInvalid:
      description: "AUTH_INVALID。账号或密码错误。首期同源网页以 401 JSON 识别会话失效。AUTH_REQUIRED 时重新登录并更新 CSRF，写操作按各接口的重放规则处理；登录凭证无效返回 AUTH_INVALID。会话认证只使用 JSESSIONID，两个 401 均不发送 WWW-Authenticate。该行为是本项目对 RFC 9110 §15.5.2 的明确取舍。"
      content:
        "application/json":
          schema:
            allOf:
              - "$ref": "#/components/schemas/Error"
              - type: "object"
                properties:
                  code:
                    type: "string"
                    enum: ["AUTH_INVALID"]
    Error403Forbidden:
      description: "FORBIDDEN。Origin 缺失或与允许的同源来源不匹配"
      content:
        "application/json":
          schema:
            allOf:
              - "$ref": "#/components/schemas/Error"
              - type: "object"
                properties:
                  code:
                    type: "string"
                    enum: ["FORBIDDEN"]
    Error415UnsupportedMediaType:
      description: "UNSUPPORTED_MEDIA_TYPE。Content-Type 缺失或与端点不匹配"
      content:
        "application/json":
          schema:
            allOf:
              - "$ref": "#/components/schemas/Error"
              - type: "object"
                properties:
                  code:
                    type: "string"
                    enum: ["UNSUPPORTED_MEDIA_TYPE"]
    Error401AuthRequired:
      description: "AUTH_REQUIRED。会话缺失或已过期。首期同源网页以 401 JSON 识别会话失效。AUTH_REQUIRED 时重新登录并更新 CSRF，写操作按各接口的重放规则处理；登录凭证无效返回 AUTH_INVALID。会话认证只使用 JSESSIONID，两个 401 均不发送 WWW-Authenticate。该行为是本项目对 RFC 9110 §15.5.2 的明确取舍。"
      content:
        "application/json":
          schema:
            allOf:
              - "$ref": "#/components/schemas/Error"
              - type: "object"
                properties:
                  code:
                    type: "string"
                    enum: ["AUTH_REQUIRED"]
    Error403CsrfInvalid:
      description: "CSRF_INVALID。写请求校验值不匹配"
      content:
        "application/json":
          schema:
            allOf:
              - "$ref": "#/components/schemas/Error"
              - type: "object"
                properties:
                  code:
                    type: "string"
                    enum: ["CSRF_INVALID"]
    Error422ValidationFailed:
      description: "VALIDATION_FAILED。参数可解析但不满足业务约束"
      content:
        "application/json":
          schema:
            allOf:
              - "$ref": "#/components/schemas/Error"
